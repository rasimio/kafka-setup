version: '3'
services:
  kafka:
    image: bitnami/kafka:latest
    ports:
      - "${KAFKA_INTERNAL_PORT}:9092"  # Для внутреннего брокера
      - "${KAFKA_CLIENT_LOCAL_PORT}:9094"  # Для локального доступа
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=CONTROLLER://:9093,INTERNAL://:9092,CLIENT_LOCAL://:9094,CLIENT_DOCKER://:9095
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:SASL_PLAINTEXT,INTERNAL:PLAINTEXT,CLIENT_LOCAL:SASL_PLAINTEXT,CLIENT_DOCKER:SASL_PLAINTEXT
      - KAFKA_CFG_ADVERTISED_LISTENERS=INTERNAL://localhost:${KAFKA_INTERNAL_PORT},CLIENT_LOCAL://localhost:${KAFKA_CLIENT_LOCAL_PORT},CLIENT_DOCKER://kafka:9095
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_CFG_SASL_MECHANISM_CONTROLLER_PROTOCOL=PLAIN
      - KAFKA_SASL_ENABLED_MECHANISMS=PLAIN
      - KAFKA_CFG_SASL_MECHANISM_INTER_BROKER_PROTOCOL=PLAIN
      - KAFKA_CONTROLLER_USER=controller
      - KAFKA_CONTROLLER_PASSWORD=${KAFKA_CONTROLLER_PASSWORD}
      - KAFKA_CLIENT_USERS=${KAFKA_CLIENT_USER}
      - KAFKA_CLIENT_PASSWORDS=${KAFKA_CLIENT_PASSWORD}
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - kafka_data:/bitnami/kafka

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "${KAFKA_UI_PORT}:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9095  # Подключаемся к внутреннему слушателю
      - KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL=SASL_PLAINTEXT
      - KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM=PLAIN
      - KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG=org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_CLIENT_USER}" password="${KAFKA_CLIENT_PASSWORD}";
      - DYNAMIC_CONFIG_ENABLED=true
    depends_on:
      - kafka

volumes:
  kafka_data: